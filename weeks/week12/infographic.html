<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infografik - Spreeland Logistics Sync</title>
<!-- Tailwind CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        vibrant: {
          bg: '#090d16',
          surface: '#0f172a',
          surfaceLight: '#1e293b',
          cyan: '#06b6d4',
          pink: '#ec4899',
          yellow: '#eab308',
          purple: '#8b5cf6',
          text: '#f8fafc',
          textMuted: '#94a3b8'
        }
      }
    }
  }
}
</script>
<style>
body {
  background-color: #090d16;
  color: #f8fafc;
  font-family: 'Inter', system-ui, sans-serif;
}
.glass-card {
  background: rgba(15, 23, 42, 0.65);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(6, 182, 212, 0.15);
  box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
}
.chart-container {
  position: relative;
  width: 100%;
  height: 250px;
}
</style>
<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="antialiased p-4">
    <div class="max-w-5xl mx-auto space-y-6">
        <div class="text-center">
            <h1 class="text-xl md:text-2xl font-black text-white tracking-tight">MAS Logistik-Sync: Spreeland 2026</h1>
            <p class="text-xs text-vibrant-textMuted mt-1">Drei Agenten koordinieren die Gürkchen-Lieferung nach Cottbus unter wechselnden Bedingungen.</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Left: Agent Status Cards -->
            <div class="lg:col-span-4 space-y-3">
                <div id="agent-farmer" class="glass-card rounded-xl p-4 border-l-4 border-green-500 transition-all duration-300">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-white">🚜 Spreewald-Farmer (A2A)</span>
                        <span id="farmer-bid" class="text-xs font-mono text-green-400">---</span>
                    </div>
                    <div class="text-[10px] text-slate-400 italic" id="farmer-thought">Bereit...</div>
                </div>
                <div id="agent-retailer" class="glass-card rounded-xl p-4 border-l-4 border-cyan-500 transition-all duration-300">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-white">🏬 Cottbus-Händler (UCP)</span>
                        <span id="retailer-bid" class="text-xs font-mono text-cyan-400">---</span>
                    </div>
                    <div class="text-[10px] text-slate-400 italic" id="retailer-thought">Bereit...</div>
                </div>
                <div id="agent-bridge" class="glass-card rounded-xl p-4 border-l-4 border-blue-500 transition-all duration-300">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-white">🌉 Brücken-Monitor (MCP)</span>
                        <span id="bridge-status" class="text-xs font-mono text-blue-400">AKTIV</span>
                    </div>
                    <div class="text-[10px] text-slate-400 italic" id="bridge-thought">Status stabil.</div>
                </div>
                
                <button id="start-sim" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-green-500 text-xs font-mono font-bold text-white shadow-lg active:scale-95 transition-all">
                    Logistik-Sync starten 🚛
                </button>
            </div>

            <!-- Right: Efficiency Chart -->
            <div class="lg:col-span-8">
                <div class="glass-card rounded-2xl p-5 h-full">
                    <h3 class="text-xs font-mono font-bold text-white mb-4 uppercase">Liefer-Effizienz & Preisstabilität</h3>
                    <div class="chart-container">
                        <canvas id="logisticsChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const ctx = document.getElementById('logisticsChart').getContext('2d');
        let logisticsChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Start', 'Phase 1', 'Phase 2', 'Phase 3', 'Phase 4', 'Phase 5'],
                datasets: [
                    { label: 'Farmer Preisvorstellung', data: [50, null, null, null, null, null], borderColor: '#22c55e', tension: 0.3 },
                    { label: 'Händler Budget', data: [30, null, null, null, null, null], borderColor: '#06b6d4', tension: 0.3 },
                    { label: 'Transport-Kosten (MCP)', data: [10, null, null, null, null, null], borderColor: '#3b82f6', tension: 0.3, fill: true, backgroundColor: 'rgba(59, 130, 246, 0.1)' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#f8fafc', font: { size: 9 } } } },
                scales: {
                    x: { ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.02)' } },
                    y: { min: 0, max: 60, ticks: { color: '#64748b' }, grid: { color: 'rgba(255,255,255,0.05)' } }
                }
            }
        });

        const simulation = [
            { farmer: 48, retailer: 32, bridge: 12, f_t: "Gute Ernte, aber Transport ist teuer.", r_t: "Suche fairen Preis für 1 Tonne.", b_t: "MCP: Wartung an Brücke A beginnt." },
            { farmer: 45, retailer: 35, bridge: 25, f_t: "A2A: Verhandle mit Fahrer-Agenten.", r_t: "UCP: Erhöhe Budget leicht.", b_t: "MCP: Brücke A gesperrt. Umleitung aktiv." },
            { farmer: 42, retailer: 38, bridge: 15, f_t: "Ok, 42ct/kg bei Sammeltransport.", r_t: "Akzeptiere bei garantierter Lieferung.", b_t: "MCP: Brücke B wieder frei." },
            { farmer: 40, retailer: 40, bridge: 10, f_t: "Deal. AG-UI: Übertrage Lieferstatus.", r_t: "AP2: Zahlung autorisiert (Limit 40).", b_t: "Status: Normalbetrieb." },
            { farmer: 40, retailer: 40, bridge: 8, f_t: "Lieferung in Cottbus angekommen.", r_t: "Wareneingang bestätigt.", b_t: "Prozess abgeschlossen." }
        ];

        let step = 0;
        document.getElementById('start-sim').addEventListener('click', function() {
            if (step >= simulation.length) {
                step = 0;
                logisticsChart.data.datasets.forEach(ds => ds.data = [ds.data[0], null, null, null, null, null]);
                logisticsChart.update();
            }
            
            this.disabled = true;
            this.innerText = "Synchronisation läuft...";

            const interval = setInterval(() => {
                const data = simulation[step];
                
                document.getElementById('farmer-bid').innerText = data.farmer + " ct";
                document.getElementById('retailer-bid').innerText = data.retailer + " ct";
                document.getElementById('bridge-status').innerText = data.bridge > 15 ? "GESPERRT" : "PASSABEL";
                
                document.getElementById('farmer-thought').innerText = data.f_t;
                document.getElementById('retailer-thought').innerText = data.r_t;
                document.getElementById('bridge-thought').innerText = data.b_t;

                logisticsChart.data.datasets[0].data[step+1] = data.farmer;
                logisticsChart.data.datasets[1].data[step+1] = data.retailer;
                logisticsChart.data.datasets[2].data[step+1] = data.bridge;
                logisticsChart.update();

                step++;
                if (step >= simulation.length) {
                    clearInterval(interval);
                    this.disabled = false;
                    this.innerText = "Simulation wiederholen 🔄";
                }
            }, 1200);
        });
    </script>
</body>
</html>
